name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Validate scanner logic
        run: |
          node --check app/src/main/assets/scanner-core.js
          node --check app/src/main/assets/scanner.js
          node --test tests/core.test.js
          node scripts/audit-ui.js

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: document-scanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
