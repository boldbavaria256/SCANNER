plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ltech.documentscanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ltech.documentscanner'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}

// OpenCV.js is downloaded during the build and then packaged under assets/.
// Runtime operation is fully offline: the installed APK never needs the CDN.
def bundledOpenCv = file('src/main/assets/opencv.js')
def openCvUrl = 'https://docs.opencv.org/4.13.0/opencv.js'

tasks.register('vendorOpenCv') {
    outputs.file bundledOpenCv
    doLast {
        if (!bundledOpenCv.exists() || bundledOpenCv.length() < 5_000_000L) {
            bundledOpenCv.parentFile.mkdirs()
            println "Bundling OpenCV.js 4.13.0 from ${openCvUrl}"
            new URL(openCvUrl).withInputStream { input ->
                bundledOpenCv.withOutputStream { output -> output << input }
            }
        }
        if (bundledOpenCv.length() < 5_000_000L) {
            throw new GradleException('OpenCV.js download is unexpectedly small; refusing to build a broken APK.')
        }
    }
}

preBuild.dependsOn tasks.named('vendorOpenCv')
